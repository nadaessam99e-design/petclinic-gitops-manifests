apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
      - name: petclinic
        image: nada_essam/petclinic-service-a:latest 
        ports:
        - containerPort: 8081
